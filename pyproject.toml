[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-detection"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy",
    "polars",
    "ua_parser",
    "plotly",
    "catboost",
    "marimo[recommended]",
]

[tool.marimo.runtime]
output_max_bytes = 15_000_000

[tool.setuptools]
packages = ["tools", "data_inspection"]
